# Production-like local validation only. It never targets a remote database.
services:
  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_DB: alplus_release
      POSTGRES_USER: alplus_release
      POSTGRES_PASSWORD: alplus_release_only_disposable
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=alplus_release --dbname=alplus_release"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: alplus_minio
      MINIO_ROOT_PASSWORD: alplus_minio_only_disposable

  migrate:
    build: .
    env_file: env.release.example
    environment:
      DATABASE_URL: ecto://alplus_release:alplus_release_only_disposable@postgres/alplus_release
    command: ["bin/alplus", "eval", "Alplus.Release.migrate()"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    env_file: env.release.example
    environment:
      DATABASE_URL: ecto://alplus_release:alplus_release_only_disposable@postgres/alplus_release
      S3_SCHEME: http://
      S3_HOST: minio
      S3_PORT: 9000
      AWS_ACCESS_KEY_ID: alplus_minio
      AWS_SECRET_ACCESS_KEY: alplus_minio_only_disposable
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
