# CI for sdks/elixir (Hex package postdeploy_sdk).
#
# Path-filtered: an SDK change runs this job alone, and a contract change runs
# it too, because the contract test reads sdks/contract from this checkout.
# The path list is repeated per trigger: GitHub Actions does not support YAML
# anchors.
name: SDK Elixir CI

on:
  push:
    branches: [master]
    paths:
      - "sdks/elixir/**"
      - "sdks/contract/**"
      - ".github/workflows/sdk-elixir-ci.yml"
  pull_request:
    paths:
      - "sdks/elixir/**"
      - "sdks/contract/**"
      - ".github/workflows/sdk-elixir-ci.yml"
  workflow_dispatch:

concurrency:
  group: sdk-elixir-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OTP_VERSION: "27.2"
  ELIXIR_VERSION: "1.18.1"

defaults:
  run:
    working-directory: sdks/elixir

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            sdks/elixir/deps
            sdks/elixir/_build
          key: sdk-elixir-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('sdks/elixir/mix.lock') }}
          restore-keys: |
            sdk-elixir-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - name: Unit and contract tests
        run: mix test
