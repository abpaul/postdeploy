# Loco configuration for automated tests and local verification.
logger:
  enable: <%= get_env(name="POSTDEPLOY_LOG", default="false") %>
  pretty_backtrace: false
  level: info
  format: compact

server:
  binding: 127.0.0.1
  port: 5167
  host: http://127.0.0.1:5167
  middlewares:
    # The application records method and path only. Loco's request logger
    # records the full URI, which can contain an ingestion key.
    logger:
      enable: false
    limit_payload:
      enable: true
      body_limit: 2mb
    fallback:
      enable: false

workers:
  mode: ForegroundBlocking

database:
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://data/test/control.sqlite?mode=rwc") %>
  enable_logging: false
  connect_timeout: 5000
  idle_timeout: 60000
  min_connections: 1
  max_connections: 4
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

settings:
  oauth:
    issuer: http://127.0.0.1:5167
    resource: http://127.0.0.1:5167/mcp
  notifications:
    public_url: http://127.0.0.1:5167
  credentials_file: <%= get_env(name="POSTDEPLOY_CREDENTIALS_FILE", default="config/credentials/test.toml.enc") %>
  tenants:
    root: <%= get_env(name="POSTDEPLOY_TENANT_ROOT", default="data/test/tenants") %>
    max_pools: 100
    max_connections: 2
  storage:
    prefix: <%= get_env(name="POSTDEPLOY_STORAGE_PREFIX", default="local-verification/default/") %>
  auth:
    secure_cookies: false
    origin: http://127.0.0.1:5167
  logs:
    retention_secs: <%= get_env(name="POSTDEPLOY_LOG_RETENTION_SECS", default="86400") %>
  backup:
    interval_secs: <%= get_env(name="POSTDEPLOY_BACKUP_INTERVAL_SECS", default="3600") %>
    initial_delay_secs: <%= get_env(name="POSTDEPLOY_BACKUP_INITIAL_DELAY_SECS", default="300") %>
