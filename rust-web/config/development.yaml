logger:
  enable: true
  pretty_backtrace: false
  level: info
  format: compact

server:
  binding: 127.0.0.1
  port: 5167
  host: http://127.0.0.1:5167
  middlewares:
    logger:
      enable: false
    limit_payload:
      enable: true
      body_limit: 2mb
    fallback:
      enable: false

workers:
  mode: ForegroundBlocking

database:
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://data/development/control.sqlite?mode=rwc") %>
  enable_logging: false
  connect_timeout: 5000
  idle_timeout: 60000
  min_connections: 1
  max_connections: 4
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

settings:
  lifecycle:
    max_cached_orgs: 4096
  oauth:
    issuer: http://127.0.0.1:5167
    resource: http://127.0.0.1:5167/mcp
  notifications:
    public_url: http://127.0.0.1:5167
  credentials_file: <%= get_env(name="POSTDEPLOY_CREDENTIALS_FILE", default="config/credentials/development.toml.enc") %>
  tenants:
    root: <%= get_env(name="POSTDEPLOY_TENANT_ROOT", default="data/development/tenants") %>
  storage:
    prefix: <%= get_env(name="POSTDEPLOY_STORAGE_PREFIX", default="development/") %>
  auth:
    secure_cookies: false
    origin: http://127.0.0.1:5167
