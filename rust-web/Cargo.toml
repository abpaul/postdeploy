[workspace]
members = [".", "migration"]

[workspace.dependencies]
loco-rs = { version = "=1.2.0", default-features = false, features = ["cli", "with-db", "db-sqlite", "storage_aws_s3"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "=2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }

[package]
name = "postdeploy"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
default-run = "postdeploy-cli"

[[bin]]
name = "postdeploy-cli"
path = "src/bin/main.rs"

[dependencies]
loco-rs = { workspace = true }
sea-orm = { workspace = true }
migration = { path = "migration" }
tenant-sqlite-loco = { git = "https://github.com/abpaul/tenant-sqlite-loco.git", rev = "b19e92c136aea1bf7cb584e7d882393cb11564fb" }
credseal = { git = "https://github.com/abpaul/credseal", rev = "21d0e0f48b71cff74738e025a774b347de16d787" }
opendal = { version = "0.58.2", default-features = false, features = ["services-s3", "services-memory", "executors-tokio", "http-transport-reqwest"] }
async-trait = "0.1"
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
bcrypt = "=0.19.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
futures = "0.3"
fs2 = "=0.4.3"
hex = "0.4"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rand = "0.9"
regex = "1"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
sha1 = "0.10"
sourcemap = "=9.3.2"
subtle = "2"
thiserror = "2"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7"] }
url = "2"
unicode-segmentation = "1"
zeroize = "1"
zstd = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["process"] }

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
sentry = { version = "0.49.3", default-features = false, features = ["logs", "ureq", "rustls", "backtrace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tower = { version = "0.5", features = ["util"] }
flate2 = "1"
chrono = "0.4"
futures = "0.3"

[profile.release]
debug = false

[profile.release.package."*"]
debug = false
